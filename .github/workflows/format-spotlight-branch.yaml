name: Format Spotlight branch

on:
  push:
    branches:
      - feat/replay-center-v0.1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/replay-center-v0.1

      - name: Install formatters
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew install --quiet obsproject/tools/gersemi
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format Spotlight files
        shell: bash
        run: |
          ./build-aux/run-gersemi CMakeLists.txt
          ./build-aux/run-clang-format src/plugin-main.cpp src/replay-dock.cpp src/replay-dock.hpp

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/plugin-main.cpp src/replay-dock.cpp src/replay-dock.hpp
          git commit -m "Format Spotlight scaffold"
          git push origin HEAD:feat/replay-center-v0.1
